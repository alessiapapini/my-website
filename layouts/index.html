{{ define "main" }}
<style>
  body { background-color: #f0f7f7; }
  .ap-main {
    max-width: 820px;
    margin: 4rem auto;
    padding: 0 2rem;
    display: flex;
    gap: 3rem;
    align-items: flex-start;
  }
  .ap-photo img {
    width: 250px;
    height: 250px;
    border-radius: 8px;
    object-fit: cover;
    display: block;
  }
  .ap-bio h1 {
    font-size: 2.4rem;
    font-weight: 100;
    letter-spacing: 0.02em;
    font-family: Lato, sans-serif;
    margin-bottom: 1.4rem;
    color: #1a1a1a;
  }
  .ap-bio p {
    font-size: 12pt;
    line-height: 1.8;
    margin-bottom: 1rem;
    font-family: Lato, sans-serif;
    color: #2c2c2c;
  }
  .ap-bio a { color: #2a8a90; text-decoration: none; }
  .ap-bio a:hover { text-decoration: underline; }
  .ap-social {
    margin-top: 1.6rem;
    display: flex;
    gap: 1.4rem;
    flex-wrap: wrap;
  }
  .ap-social a {
    color: #2a8a90;
    font-size: 0.92rem;
    text-decoration: none;
    font-family: Lato, sans-serif;
  }
  .ap-social a:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    .ap-main { flex-direction: column; align-items: center; }
    .ap-bio h1 { font-size: 1.8rem; text-align: center; }
  }
</style>
<div class="ap-main">
  <div class="ap-photo">
    <img src="/my-website/img/photo.jpg" alt="Alessia Papini">
  </div>
  <div class="ap-bio">
    <h1>Alessia Papini</h1>
    {{ .Content }}
    <div class="ap-social">
      <a href="mailto:alessia.papini@eui.eu">✉ Email</a>
      <a href="https://www.linkedin.com/in/alessiapapini99/">LinkedIn</a>
      <a href="https://scholar.google.com/citations?user=_TfWd_0AAAAJ&hl=it">Scholar</a>
      <a href="https://x.com/alespapini">𝕏 Twitter</a>
    </div>
  </div>
</div>
{{ end }}
