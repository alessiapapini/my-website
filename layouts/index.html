
{{ define "main" }}
<div class="container">
  <div class="row" style="margin-top: 2.5rem; align-items: center;">

    <!-- Biography -->
    <div class="col-sm-8">

      <h1 style="
        font-size: 2.5rem;
        font-weight: 300;
        font-family: Lato, sans-serif;
        margin-bottom: 1.8rem;">
        {{ .Site.Title }}
      </h1>

      <div style="
        font-family: Lato, sans-serif;
        line-height: 1.7;">
        {{ .Content }}
      </div>

      <!-- Contact and academic links -->
      <div style="
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem 1.5rem;
        font-family: Lato, sans-serif;">

        <a href="mailto:alessia.papini@eui.eu">Email</a>

        

        <a href="https://www.linkedin.com/in/alessiapapini99/"
           target="_blank" rel="noopener noreferrer">LinkedIn</a>

        <a href="https://scholar.google.com/citations?user=_TfWd_0AAAAJ&hl=it"
           target="_blank" rel="noopener noreferrer">Scholar</a>

        <a href="https://x.com/alespapini"
           target="_blank" rel="noopener noreferrer">Twitter</a>

      </div>
    </div>

    <!-- Profile picture -->
    <div class="col-sm-4" style="
      text-align: center;
      padding-top: 1rem;">

      <img
        src="{{ "img/photo.jpg" | relURL }}"
        alt="Alessia Papini"
        style="
          border-radius: 50%;
          width: 250px;
          height: 250px;
          max-width: 100%;
          object-fit: cover;">
    </div>

  </div>
</div>

<style>
  .container a {
    color: #2a8a90;
  }

  .container a:hover {
    color: #206b70;
    text-decoration: underline;
  }

  @media (max-width: 575px) {
    .container .row {
      margin-top: 2rem !important;
    }

    .container .col-sm-4 {
      margin-top: 2rem;
    }
  }
</style>

<style>
/* Homepage biography typography */
.container .col-sm-8 > div:has(p) {
    font-size: 18px;
    line-height: 1.8;
}

.container .col-sm-8 > div:has(p) p {
    margin-bottom: 1.4rem;
}
</style>


<style>
/* More spacious homepage */
.container .col-sm-8 h1 {
    margin-bottom: 2.25rem !important;
}

.container .col-sm-8 > div:has(p) {
    font-size: 19px !important;
    line-height: 1.8 !important;
}

.container .col-sm-8 > div:has(p) p {
    margin-bottom: 1.5rem !important;
}

.container .col-sm-8 > div:has(a):not(:has(p)) {
    margin-top: 2.5rem !important;
}
</style>

{{ end }}
